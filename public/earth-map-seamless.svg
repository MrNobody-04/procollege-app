<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <radialGradient id="oceanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </radialGradient>
  </defs>
  <rect width="1000" height="500" fill="url(#oceanGlow)" />
  
  <!-- Continents - Copy 1 (0 to 500) -->
  <g fill="#64748b" fill-opacity="0.75" stroke="#94a3b8" stroke-width="1.2">
    <!-- North America -->
    <path d="M 60,60 Q 90,40 130,50 Q 150,80 140,120 Q 110,140 90,180 Q 70,210 90,230 Q 70,220 50,180 Q 40,140 50,100 Z" />
    <!-- Greenland -->
    <path d="M 170,40 Q 200,35 190,65 Q 165,70 170,40 Z" />
    <!-- South America -->
    <path d="M 110,240 Q 150,250 160,290 Q 150,350 120,400 Q 100,420 95,380 Q 90,320 95,270 Z" />
    <!-- Europe -->
    <path d="M 230,80 Q 270,70 290,110 Q 270,140 240,140 Q 220,110 230,80 Z" />
    <!-- Africa -->
    <path d="M 230,160 Q 280,160 300,210 Q 290,280 260,330 Q 230,310 220,250 Q 210,200 230,160 Z" />
    <!-- Asia -->
    <path d="M 300,80 Q 380,70 420,110 Q 440,160 410,210 Q 370,220 340,190 Q 310,160 300,120 Z" />
    <!-- India / South Asia -->
    <path d="M 345,180 Q 365,190 355,230 Q 335,210 345,180 Z" />
    <!-- Australia -->
    <path d="M 400,290 Q 450,290 450,340 Q 410,360 390,330 Z" />
  </g>

  <!-- Continents - Copy 2 (500 to 1000) for Seamless Repeat -->
  <g transform="translate(500, 0)" fill="#64748b" fill-opacity="0.75" stroke="#94a3b8" stroke-width="1.2">
    <!-- North America -->
    <path d="M 60,60 Q 90,40 130,50 Q 150,80 140,120 Q 110,140 90,180 Q 70,210 90,230 Q 70,220 50,180 Q 40,140 50,100 Z" />
    <!-- Greenland -->
    <path d="M 170,40 Q 200,35 190,65 Q 165,70 170,40 Z" />
    <!-- South America -->
    <path d="M 110,240 Q 150,250 160,290 Q 150,350 120,400 Q 100,420 95,380 Q 90,320 95,270 Z" />
    <!-- Europe -->
    <path d="M 230,80 Q 270,70 290,110 Q 270,140 240,140 Q 220,110 230,80 Z" />
    <!-- Africa -->
    <path d="M 230,160 Q 280,160 300,210 Q 290,280 260,330 Q 230,310 220,250 Q 210,200 230,160 Z" />
    <!-- Asia -->
    <path d="M 300,80 Q 380,70 420,110 Q 440,160 410,210 Q 370,220 340,190 Q 310,160 300,120 Z" />
    <!-- India / South Asia -->
    <path d="M 345,180 Q 365,190 355,230 Q 335,210 345,180 Z" />
    <!-- Australia -->
    <path d="M 400,290 Q 450,290 450,340 Q 410,360 390,330 Z" />
  </g>
</svg>
